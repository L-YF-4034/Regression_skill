<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2030" role="img" aria-labelledby="flowtitle"><title id="flowtitle">含VIF與多項式選擇的迴歸流程</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><style>.box{fill:#f1f6fa;stroke:#c4d5e0;stroke-width:1.5}.gate{fill:#e1f4f1;stroke:#087e8b;stroke-width:2}.node-title{font:700 17px Microsoft JhengHei,sans-serif;fill:#152b3c;text-anchor:middle}.node-sub{font:12px Microsoft JhengHei,sans-serif;fill:#52667a;text-anchor:middle}.edge{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arr)}.branch{font:13px Microsoft JhengHei,sans-serif;fill:#52667a}</style><path class="edge" d="M440 86 V125"/><path class="edge" d="M440 198 V237"/><path class="edge" d="M440 310 V349"/><path class="edge" d="M440 422 V461"/><path class="edge" d="M440 534 V573"/><path class="edge" d="M440 646 V685"/><path class="edge" d="M440 758 V797"/><path class="edge" d="M440 870 V909"/><path class="edge" d="M440 982 V1021"/><path class="edge" d="M440 1094 V1133"/><path class="edge" d="M440 1206 V1245"/><path class="edge" d="M440 1318 V1357"/><path class="edge" d="M440 1430 V1469"/><path class="edge" d="M440 1542 V1581"/><path class="edge" d="M440 1654 V1693"/><path class="edge" d="M440 1766 V1805"/><path class="edge" d="M440 1878 V1917"/><rect class="box" x="155" y="15" width="570" height="72" rx="14"/><text class="node-title" x="440" y="46">資料檢查與所有數值變數散佈圖</text><text class="node-sub" x="440" y="71">先看資料，不預設Y或X</text><rect class="gate" x="155" y="127" width="570" height="72" rx="14"/><text class="node-title" x="440" y="158">詢問：哪個是Y？哪些是X？</text><text class="node-sub" x="440" y="183">停止等待指定角色</text><rect class="box" x="155" y="239" width="570" height="72" rx="14"/><text class="node-title" x="440" y="270">列設定、一次候選公式與VIF</text><text class="node-sub" x="440" y="295">只診斷X設計；單一數值X的VIF＝1</text><rect class="box" x="155" y="351" width="570" height="72" rx="14"/><text class="node-title" x="440" y="382">依圖形提出一次或多項式候選</text><text class="node-sub" x="440" y="407">指出具體X與二次／三次項及理由</text><rect class="gate" x="155" y="463" width="570" height="72" rx="14"/><text class="node-title" x="440" y="494">詢問模型及各X要用幾階？</text><text class="node-sub" x="440" y="519">停止等待；不自動採推薦階數</text><rect class="box" x="155" y="575" width="570" height="72" rx="14"/><text class="node-title" x="440" y="606">確認中心化與中心值，重算最終VIF</text><text class="node-sub" x="440" y="631">保留所有低階項，列實際公式</text><rect class="gate" x="155" y="687" width="570" height="72" rx="14"/><text class="node-title" x="440" y="718">是否依最終公式進行配適？</text><text class="node-sub" x="440" y="743">停止等待；否則結束並以已完成內容生成報告</text><rect class="box" x="155" y="799" width="570" height="72" rx="14"/><text class="node-title" x="440" y="830">配適模型與原始資料比較</text><text class="node-sub" x="440" y="855">summary、CI、F、R²、直線／多項式曲線</text><rect class="gate" x="155" y="911" width="570" height="72" rx="14"/><text class="node-title" x="440" y="942">是否進行殘差分析？</text><text class="node-sub" x="440" y="967">停止等待使用者回答</text><rect class="box" x="155" y="1023" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1054">殘差圖與SW、BP、雙尾DW</text><text class="node-sub" x="440" y="1079">DW一律執行；註明目前row次序的意義</text><rect class="gate" x="155" y="1135" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1166">提出建議：是否進行Box-Cox探索？</text><text class="node-sub" x="440" y="1191">停止等待；Y須為正值</text><rect class="box" x="155" y="1247" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1278">Box-Cox plot、lambda估計與95%CI</text><text class="node-sub" x="440" y="1303">先展示profile結果，尚未轉換</text><rect class="gate" x="155" y="1359" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1390">指定lambda或使用估計值；確認轉換</text><text class="node-sub" x="440" y="1415">同意且未指定時使用估計值</text><rect class="box" x="155" y="1471" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1502">轉換Y、重新配適與殘差診斷</text><text class="node-sub" x="440" y="1527">保留X階數、中心值；記錄實際lambda</text><rect class="gate" x="155" y="1583" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1614">是否檢測離群與影響點？</text><text class="node-sub" x="440" y="1639">停止等待；不自動刪點</text><rect class="box" x="155" y="1695" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1726">只列被標記樣本與觸發原因</text><text class="node-sub" x="440" y="1751">沒有被標記樣本時，明確說沒有</text><rect class="box" x="155" y="1807" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1838">告知：此次分析結束</text><text class="node-sub" x="440" y="1863">流程結束後才開始生成最終報告</text><rect class="box" x="155" y="1919" width="570" height="72" rx="14"/><text class="node-title" x="440" y="1950">僅以成功完成內容生成QMD，再編譯PDF</text><text class="node-sub" x="440" y="1975">未完成章節整段排除；code → 結果 → 解釋</text><path class="edge" d="M725 946 H825 V1618 H730"/><text class="branch" x="831" y="996">否</text><path class="edge" d="M155 1170 H75 V1618 H150"/><text class="branch" x="5" y="1220">否／不需</text><path class="edge" d="M155 1394 H120 V1618 H150"/><text class="branch" x="5" y="1444">不轉換</text><path class="edge" d="M725 1618 H780 V1842 H730"/><text class="branch" x="786" y="1668">否</text></svg>